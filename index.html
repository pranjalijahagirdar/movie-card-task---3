    <div class="backDrop ModelClose" id="backDrop"></div>
            <form id="MovieForm">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <h4>Add Movie</h4>
                        <i class="fa-solid fa-xmark closeForm ModelClose" id="formCloseMovie" role="button"></i>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label for="movieName">Movie Name</label>
                            <input type="text" required id="movieName" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="movieImg">Movie Image</label>
                            <input type="text" required id="movieImg" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="movieDesciption">Movie Desciption</label>
                            <textarea type="text" required id="movieDesciption" class="form-control"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="movieRating">Movie Rating</label>
                            <select id="movieRating" class="form-control">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
